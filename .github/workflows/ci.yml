# CI pipeline for NPVTunnel.
#
# Two layers:
#  1. `master` - the reusable master-ci pipeline (WasewaseX/master-ci@v2),
#     which auto-detects the Rust stack and runs rustfmt, clippy
#     (-D warnings), cargo-machete, cargo-deny (advisories + licenses +
#     sources) and the full test suite. Least-privilege permissions; no
#     secrets are inherited.
#  2. `windows` - the actual Windows release compile: native x64 build and
#     test on windows-latest, with the npvtunnel.exe artifact uploaded.
#  3. `codeql` - security analysis, results to the Security tab.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  master:
    uses: WasewaseX/master-ci/.github/workflows/master-ci.yml@v2
    with:
      template_ref: v2
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write

  windows:
    name: windows-x64 release build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run tests (release)
        run: cargo test --locked --release

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/NPVTunnel.exe dist/
          Copy-Item target/release/npvt-cli.exe dist/
          Copy-Item assets/README-windows.txt dist/
          Compress-Archive -Path dist/* -DestinationPath npvtunnel-windows-x64.zip -Force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npvtunnel-windows-x64
          path: npvtunnel-windows-x64.zip
          if-no-files-found: error

  codeql:
    uses: WasewaseX/master-ci/.github/workflows/codeql.yml@v2
    with:
      languages: rust
      template_ref: v2
    permissions:
      contents: read
      security-events: write
