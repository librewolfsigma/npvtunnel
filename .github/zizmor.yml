# Repo-owned zizmor policy.
#
# Keeps the strong default: every `uses:` must be pinned to a commit SHA,
# with the documented exception of calling the Master CI reusable
# workflows by release tag. The workflows avoid actions whose hash pins
# zizmor cannot resolve from rate-limited unauthenticated API checks on
# shared runners (the runner image ships stable Rust, so no toolchain
# setup action is needed at all).
rules:
  unpinned-uses:
    config:
      policies:
        "WasewaseX/master-ci/*": ref-pin
        "*": hash-pin
