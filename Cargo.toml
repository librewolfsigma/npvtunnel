[workspace]
resolver = "2"
members = ["crates/npvt-core", "crates/npvt-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["librewolfsigma"]
repository = "https://github.com/librewolfsigma/npvtunnel"
homepage = "https://github.com/librewolfsigma/npvtunnel"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
