[package]
name = "npvt-gui"
description = "NPV TUNNEL - the NPVTunnel native Windows GUI client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "NPVTunnel"
path = "src/main.rs"

[dependencies]
arboard = "3"
base64 = "0.22"
ed25519-dalek = "2"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
npvt-core = { path = "../npvt-core" }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.18"
tray-icon = "0.10"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
