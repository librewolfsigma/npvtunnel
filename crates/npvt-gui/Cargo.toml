[package]
name = "npvt-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native NPVTunnel desktop GUI: vault, groups and engine control in a console-free window."
publish = false

# The shipped binary is the GUI; the binary name is the product name so the
# double-clickable file is `NPVTunnel.exe`.
[[bin]]
name = "NPVTunnel"
path = "src/main.rs"

[dependencies]
npvt-core = { path = "../npvt-core" }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
rqrr = "0.7"

# Native Windows file dialogs. Non-Windows dev builds use the stubs in
# pick.rs so the Linux check lane never compiles the portal/GTK stacks.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
