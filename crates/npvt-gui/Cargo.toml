[package]
name = "npvt-gui"
description = "NPVTunnel for Windows - native desktop GUI client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# The shipped binary is the GUI; the binary name is the product name so the
# double-clickable file is `NPVTunnel.exe` (no terminal ever opens).
[[bin]]
name = "NPVTunnel"
path = "src/main.rs"

[dependencies]
npvt-core = { path = "../npvt-core" }
serde.workspace = true
serde_json.workspace = true
# default-features off drops the accesskit/atspi (Linux screen-reader) and
# web_screen_reader stacks: their zbus/atspi chain carries several
# unmaintained-crate advisories and is not needed for this desktop client.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quircs = "0.10"
arboard = { version = "3", default-features = false }
ureq = "2"
base64 = "0.22"
ed25519-dalek = "3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
# No linux portal/gtk backends: the GUI ships for Windows only.
rfd = { version = "0.14", default-features = false }

[build-dependencies]
winresource = "0.1"
