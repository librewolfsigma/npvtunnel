# cargo-deny policy for NPVTunnel.
# CI runs `cargo deny check advisories licenses sources` per crate.

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # GUI dependency tree (egui/eframe, arboard, dirs):
    "BSL-1.0",          # Boost, permissive (text shaping crates)
    "MPL-2.0",          # weak file-level copyleft (option-ext, error-code)
    "OFL-1.1",          # bundled font license (Inter, egui fonts crate)
    "Ubuntu-font-1.0",  # egui's bundled Ubuntu-Light font
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
